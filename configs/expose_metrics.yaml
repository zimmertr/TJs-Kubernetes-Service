# Control plane nodes only.
# etcd has no typed document in Talos 1.14, so it stays in v1alpha1 cluster.etcd.
cluster:
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0
---
# The generated KubeProxyConfig has `config: {}`, so Talos runs kube-proxy from a
# --config file; set the metrics address there rather than as a flag.
apiVersion: v1alpha1
kind: KubeProxyConfig
config:
  metricsBindAddress: 0.0.0.0:10249
