name: PR Title

# The PR title becomes the squash commit's title, and that title alone picks
# the release bump. yggdrasil's pr-title module refuses a title that isn't
# `type(scope): summary` with one of the types its GitVersion patterns read,
# so every title releases as intended. Renovate's titles (`chore(deps): ...`)
# already pass.
#
# A workflow of its own, because it has to run when only the title changes
# (`edited`), and an edit must not rerun the Terraform checks. `synchronize`
# stays in the list because a check reports against the head commit.
#
# The main ruleset requires `PR Title / PR Title` (this job's name, then the
# module's); renaming either strands PRs on a check that never reports.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main

permissions: {}

jobs:
  title:
    name: PR Title
    uses: zimmertr/yggdrasil/.github/workflows/pr-title.yml@fd0ee632ebad3cb4623bd64ca77838e6aa7a2dce # v1.2.4
    permissions:
      pull-requests: read # the module reads the PR's title
