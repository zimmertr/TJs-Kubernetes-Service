name: Scorecard

# yggdrasil's scorecard module: OpenSSF Scorecard on every push to main and
# weekly, with its findings in the Security tab. No badge.
on:
  schedule:
    - cron: "37 6 * * 1"
  push:
    branches: [main]

permissions: {}

jobs:
  scorecard:
    name: Scorecard
    uses: zimmertr/yggdrasil/.github/workflows/scorecard.yml@e229a6868b9d1bf4a596e0a8844452770a543a6c # v3.0.0
    permissions:
      contents: read
      security-events: write # the SARIF upload to code scanning
