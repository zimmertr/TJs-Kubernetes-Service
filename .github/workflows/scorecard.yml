name: Scorecard

# yggdrasil's scorecard module: OpenSSF Scorecard on every push to main and
# weekly, with its findings in the Security tab. No badge.
on:
  schedule:
    - cron: "37 6 * * 1"
  push:
    branches: [main]

permissions: {}

jobs:
  scorecard:
    name: Scorecard
    uses: zimmertr/yggdrasil/.github/workflows/scorecard.yml@2581d736b8cbff87c94c055f985062a73cffdccb # v3.1.3
    permissions:
      contents: read
      security-events: write # the SARIF upload to code scanning
