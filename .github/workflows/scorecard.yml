name: Scorecard

# yggdrasil's scorecard module: OpenSSF Scorecard on every push to main and
# weekly, with its findings in the Security tab. No badge.
on:
  schedule:
    - cron: "37 6 * * 1"
  push:
    branches: [main]

permissions: {}

jobs:
  scorecard:
    name: Scorecard
    uses: zimmertr/yggdrasil/.github/workflows/scorecard.yml@1662d921a9f6d3d0ac42d5777bb148f533b0fd5e # v3.1.6
    permissions:
      contents: read
      security-events: write # the SARIF upload to code scanning
