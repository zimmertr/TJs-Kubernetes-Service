name: Scorecard

# yggdrasil's scorecard module: OpenSSF Scorecard on every push to main and
# weekly, with its findings in the Security tab. No badge.
on:
  schedule:
    - cron: "37 6 * * 1"
  push:
    branches: [main]

permissions: {}

jobs:
  scorecard:
    name: Scorecard
    uses: zimmertr/yggdrasil/.github/workflows/scorecard.yml@47059cdc3da02c837181fbb16cd5d8647dd968d8 # v3.1.5
    permissions:
      contents: read
      security-events: write # the SARIF upload to code scanning
