name: Scorecard

# yggdrasil's scorecard module: OpenSSF Scorecard on every push to main and
# weekly, with its findings in the Security tab. No badge.
on:
  schedule:
    - cron: "37 6 * * 1"
  push:
    branches: [main]

permissions: {}

jobs:
  scorecard:
    name: Scorecard
    uses: zimmertr/yggdrasil/.github/workflows/scorecard.yml@c8d95dfce582c36045b95a5c0b38eb62c4d4fae0 # v3.1.0
    permissions:
      contents: read
      security-events: write # the SARIF upload to code scanning
