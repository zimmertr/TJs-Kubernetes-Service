name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

# The main ruleset requires `Terraform / fmt`, `Terraform / validate`,
# `Terraform / test`, `Terraform / tflint`, `Terraform / trivy` (this job's
# name, then the module's) and `shellcheck`; renaming a job strands PRs on a
# check that never reports.
jobs:
  # zimmertr/yggdrasil's terraform module, in the images its compose.yml pins
  # (decision record 0039). It runs validate, test and Trivy in each folder
  # listed here, so a new module joins this list.
  terraform:
    name: Terraform
    uses: zimmertr/yggdrasil/.github/workflows/terraform.yml@a8d40e048716cc78d419faf3fc4593f465a11f13 # v1.2.6
    with:
      directories: . bootstrap modules/gpu_worker modules/node modules/pci_device modules/talos_image
    permissions:
      contents: read

  # The workflows are linted by lint.yml; this covers the scripts it can't see.
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make shellcheck
