name: Release

# Every merge to main is released through yggdrasil's release module: GitVersion
# reads the bump from the squash commit's title and counts from the latest v*
# tag, then the commit is tagged and released with generated notes. TKS ships
# no image, so the module only tags and releases. On a PR, the same module runs
# as a dry run and says in its job summary which version the merge releases.
# Decision record 0038.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# One release at a time, so two quick merges can't race for the same version.
# cancel-in-progress stays false on main so every merge still releases, in
# order. A PR's dry run only reports, so a newer push replaces it.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  release:
    name: Release
    uses: zimmertr/yggdrasil/.github/workflows/release.yml@f805e7b874e54e661d8dc8ad528883228bfc567b # v1.2.9
    # GitHub refuses the whole run when a module job asks for more than the
    # caller grants, even a job the dry run skips, so a PR grants write too.
    # Only the module's Tag and Release job uses it, and never in a dry run.
    permissions:
      contents: write # the tag and release
      packages: write # asked for by the module's Build & Push, which never runs here: TKS ships no image
    with:
      dry-run: ${{ github.event_name == 'pull_request' }}
