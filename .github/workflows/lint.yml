name: Lint

# yggdrasil's lint module: actionlint and zizmor's pedantic audits over the
# workflows, and Semgrep's rule that a tagged Dockerfile FROM carries a digest
# (this repo has no Dockerfile, so that job scans nothing), shellcheck over
# `.github/scripts/` and `bin/tks`, and the docs' links and em dashes.
#
# The main ruleset requires `Lint / actionlint`, `/ zizmor`, `/ semgrep`,
# `/ shellcheck` and `/ docs` (this job's name, then the module's); renaming
# either strands PRs on a check that never reports.
on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  lint:
    name: Lint
    uses: zimmertr/yggdrasil/.github/workflows/lint.yml@47059cdc3da02c837181fbb16cd5d8647dd968d8 # v3.1.5
    permissions:
      contents: read
